# Profile usado exclusivamente pela esteira de CI (GitHub Actions).
# Usa H2 em memória para que a API possa subir sem depender de um
# servidor MySQL externo durante a execução automatizada dos testes.
#
# Ativado com: --spring.profiles.active=ci
spring.application.name=demo

spring.datasource.url=jdbc:h2:mem:cidb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
