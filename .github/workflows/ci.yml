name: CI - Testes Automatizados

# Gatilho: roda sempre que um Pull Request for aberto, reaberto ou
# atualizado (novos commits) com destino à branch main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancela execuções antigas da esteira se um novo commit chegar no
# mesmo PR enquanto uma execução anterior ainda está rodando.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build e testes (API, Client, E2E)
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Configuração do ambiente
      # ------------------------------------------------------------
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Garantir permissão de execução do Maven Wrapper
        working-directory: api
        run: chmod +x mvnw

      # ------------------------------------------------------------
      # 2. Instalação das dependências
      # ------------------------------------------------------------
      - name: Instalar dependências do client
        working-directory: client
        run: npm ci

      - name: Instalar dependências do projeto de testes (Playwright)
        working-directory: tests
        run: npm install

      - name: Instalar navegadores do Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      # ------------------------------------------------------------
      # 3. Testes de caixa-branca (Atividade 4)
      # ------------------------------------------------------------
      - name: Rodar testes da API (JUnit)
        working-directory: api
        run: ./mvnw test

      - name: Rodar testes do client (Jest)
        working-directory: client
        run: npm test -- --ci

      # ------------------------------------------------------------
      # 4. Build e inicialização dos serviços (API + Client)
      # ------------------------------------------------------------
      - name: Buildar a API (gerar .jar)
        working-directory: api
        run: ./mvnw -DskipTests package

      - name: Iniciar a API em background (profile de CI, com H2)
        working-directory: api
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=ci \
            > api.log 2>&1 &

      - name: Esperar a API responder em http://localhost:8080
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8080/auth/signin; then
              echo "API respondendo."
              exit 0
            fi
            echo "Aguardando a API subir... ($i/60)"
            sleep 2
          done
          echo "A API não respondeu a tempo."
          cat api/api.log || true
          exit 1

      - name: Buildar o client (Next.js)
        working-directory: client
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:8080
        run: npm run build

      - name: Iniciar o client em background
        working-directory: client
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:8080
        run: |
          nohup npm run start > client.log 2>&1 &

      - name: Esperar o client responder em http://localhost:3000
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Client respondendo."
              exit 0
            fi
            echo "Aguardando o client subir... ($i/60)"
            sleep 2
          done
          echo "O client não respondeu a tempo."
          cat client/client.log || true
          exit 1

      # ------------------------------------------------------------
      # 5. Testes de caixa-preta (Atividade 5): E2E e API
      # ------------------------------------------------------------
      - name: Rodar testes E2E e de API (Playwright)
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:8080
        run: npx playwright test

      # ------------------------------------------------------------
      # 6. Artefatos (relatórios), úteis para depuração em caso de falha
      # ------------------------------------------------------------
      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Publicar logs da API e do client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: |
            api/api.log
            client/client.log
          retention-days: 7
